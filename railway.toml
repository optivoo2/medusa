[build]
builder = "dockerfile"
dockerfile = "Dockerfile.test"

[deploy]
startCommand = "node server-test.js"
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
# Railway will automatically set these, but we can document them here
# DATABASE_URL = "provided by Railway postgres service"
# REDIS_URL = "provided by Railway redis service" 
# JWT_SECRET = "provided by Railway"
# COOKIE_SECRET = "provided by Railway"

NODE_ENV = "production"
PORT = "9000"
SKIP_ENV_VALIDATION = "1"

[environments.production.build]
# Optimize build settings for production
buildCommand = "yarn build"

[health]
# Configure health check path
path = "/health"
interval = 30
timeout = 10
retries = 3