[phases.setup]
nixPkgs = ["nodejs_18", "npm"]

[phases.install]
cmd = "npm install --legacy-peer-deps --production=false"

[phases.build]
cmd = "echo 'Skipping build - using simple-server.js directly'"

[start]
cmd = "node simple-server.js"

[variables]
NODE_ENV = "production"
PORT = "3000"
HOST = "0.0.0.0"

[staticAssets]
"uploads" = "uploads"